plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.105'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "mineclient-bridge-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
}

repositories.configureEach {
    if (it instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository
            && it.url.host == 'maven.neoforged.net') {
        content {
            includeGroupByRegex 'net\\.(neoforged|minecraftforge)(\\..*)?'
            includeGroupByRegex 'cpw\\.mods(\\..*)?'
        }
    }
}

neoForge {
    version = project.neo_version
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

def lwjglNatives = {
    def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def family = os.contains('windows') ? 'windows' : (os.contains('mac') ? 'macos' : 'linux')
    def arm = System.getProperty('os.arch') in ['aarch64', 'arm64']
    "natives-${family}${arm ? '-arm64' : ''}"
}()

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.apache.logging.log4j:log4j-api:2.24.1'
    testImplementation 'org.lwjgl:lwjgl:3.3.3'
    testImplementation 'org.lwjgl:lwjgl-glfw:3.3.3'
    testRuntimeOnly "org.lwjgl:lwjgl:3.3.3:${lwjglNatives}"
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.test {
    useJUnitPlatform()
    systemProperty 'mineclientBridge.projectDir', project.projectDir.absolutePath
    // [Arcane Academy fork] Exercise actual premain/redefine behavior in a small, game-free JVM.
    dependsOn tasks.named('jar')
    systemProperty 'mineclientBridge.agentJar', tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        into ''
    }
    manifest {
        attributes(
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version)
    }
}

// [Arcane Academy fork] The same development jar is both an FML mod and an optional Java agent.
tasks.named('jar', Jar) {
    manifest.attributes('Premain-Class': 'io.github.campione01.mineclientbridge.agent.BridgeAgent',
            'Can-Redefine-Classes': 'true')
    // No retransformation: the transformer only observes initial definitions.
}
