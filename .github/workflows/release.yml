name: release

# [Arcane Academy fork] Publishes a GitHub release with the mod jar when a fork version tag
# (for example v1.1.8-aa.2) is pushed. scripts/release.ps1 creates and pushes that tag. The
# Arcane Academy build downloads the jar from the release by its exact file name.

on:
  push:
    tags:
      - 'v*-aa.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches mod_version
        shell: pwsh
        run: |
          $version = (Select-String -Path gradle.properties -Pattern '^mod_version=(.+)$').Matches[0].Groups[1].Value.Trim()
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match mod_version $version"
          }
          if (-not (Test-Path "docs/changelog-$version.md")) {
            throw "docs/changelog-$version.md is missing"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and test mod
        run: .\gradlew.bat clean build --no-daemon --console=plain
      - name: Test MCP server
        run: npm --prefix .\mcp test
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $jar = "build/libs/mineclient-bridge-neoforge-1.21.1-$env:VERSION.jar"
          gh release create '${{ github.ref_name }}' $jar `
            --title "MineClient Bridge $env:VERSION (Arcane Academy fork)" `
            --notes-file "docs/changelog-$env:VERSION.md"
